<!DOCTYPE html>
<html lang="sk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Obedove menu v okoli FEI STU</title>

        <link rel="icon" href="restaurant.ico" type="image/x-icon">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" href="css/style.css">
    </head>
    <body class ="bg-light">
        <header class ="bg-white border-bottom py-3 mb-4">
            <div class="container d-flex justify-content-between align-items-center">
                <h1>Jedalen|Info</h1>
                <nav>
                    <ul class="nav">
                        <li class="nav-item"><a href="index.html" class="nav-link active fw-bold" aria-current="page">Menu</a></li>
                        <li class="nav-item"><a href="pages/about.html" class="nav-link text-secondary">About</a></li>
                    </ul>
                </nav>
            </div>
        </header> 
        <main class="container">
            <section class="card p-3 mb-4">
                <div class="row align-items-center g-3">

                    <div class="col-12 col-md-auto">
                        <div class="btn-group" role="group">
                            <button type="button" id="refresh_info" class="btn btn-dark">Aktualizovať menu</button>
                            <button type="button" id="delete_info" class="btn btn-danger">Vymazať uložené dáta</button>
                        </div>
                    </div>

                    <div class="col-12 col-md-auto ms-md-auto d-flex align-items-center gap-2">
                        <label for="source-toggle" class="form-label m-0 fw-semibold">Zdroj dát:</label>
                        <select id="source-toggle" class="form-select form-select-sm w-auto">
                          <option value="local" selected>Lokálne kópie </option>
                          <option value="live">Živé načítanie </option>
                        </select>
                      </div>
                </div>

                <div class="border-top mt-3 pt-3 d-flex align-items-center gap-2">
                    <div id="loading-spinner" class="spinner-border spinner-border-sm text-primary d-none" role="status">
                        <span class="visually-hidden">Načítavam...</span>
                    </div>

                    <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill">Status</span>
                    <p id="status-message" class="text-secondary small m-0">
                      Pripravené na načítanie dát.
                    </p>
                </div>
            </section>

            <section class="card p-3 mb-4">
                <div class="mb-3">
                    <label class="form-label fw-bold d-block mb-2">Vyberte deň:</label>
                    <div class="d-flex flex-wrap gap-2" id="days" role="group" aria-label="Výber dňa v týždni">
                        <button type="button" data-day="0" class="btn btn-outline-dark active">Pondelok</button>
                        <button type="button" data-day="1" class="btn btn-outline-dark">Utorok</button>
                        <button type="button" data-day="2" class="btn btn-outline-dark">Streda</button>
                        <button type="button" data-day="3" class="btn btn-outline-dark">Štvrtok</button>
                        <button type="button" data-day="4" class="btn btn-outline-dark">Piatok</button>
                        <button type="button" data-day="all" class="btn btn-outline-warning">Celý týždeň</button>
                    </div>
                </div>

                <hr class="my-2">

                <div class="pt-3">
                    <span class="fw-bold me-3 d-inline-block mb-2">Filtrovať reštaurácie:</span>
                    <div class="d-inline-flex flex-wrap gap-3">
                        <div class="form-check form-check-inline m-0">
                            <input class="form-check-input filter-restaurant" type="checkbox" id="filter-freefood" value="freefood" checked>
                            <label class="form-check-label" for="filter-freefood">FreeFood</label>
                        </div>
                        <div class="form-check form-check-inline m-0">
                            <input class="form-check-input filter-restaurant" type="checkbox" id="filter-idyla" value="idyla" checked>
                            <label class="form-check-label" for="filter-idyla">IDYLA</label>
                        </div>
                        <div class="form-check form-check-inline m-0">
                            <input class="form-check-input filter-restaurant" type="checkbox" id="filter-eat" value="eat" checked>
                            <label class="form-check-label" for="filter-eat">Eat & Meet</label>
                        </div>
                    </div>
                </div>
            </section>

            <section id="menu-container" class=" row g-4 mb-5">

            </section>
        </main>

        <footer class="bg-white border-top py-4 mt-auto">
            <div class="container text-center text-dark small">
                <p class="mb-1">Použité knižnice: <span class="fw-semibold text-dark">Bootstrap v5.3.3</span> (CSS &amp; JS)</p>
                
                <p class="m-0">2026 Dmytro Hodunov | FEI STU Bratislava</p>
            </div>
        </footer>


        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <script src="js/script.js"></script>
    </body>
</html>
