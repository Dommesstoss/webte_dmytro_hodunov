<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiná v Bratislave</title>
  <!-- Подключаем Bootstrap CSS ПЕРВЫМ, чтобы наши стили могли переопределить его правила (Шаг 4) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <!-- Подключаем собственные стили ВТОРЫМИ -->
  <link rel="stylesheet" href="css/styles.css">
  <!-- Скрипты с defer выполняются строго по порядку в HTML: сначала функции-парсеры, потом script.js -->
  <script src="js/parsers.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="container py-4">
    <h1>Kiná v Bratislave</h1>

    <!-- Текстовое поле для статуса загрузки -->
    <p id="status">Programy sa načítavajú…</p>
    <p>
      <!-- Кнопка обновления всех кинотеатров сразу -->
      <button id="refresh" type="button">Aktualizovať všetko</button>
      <!-- Переключатель между локальными файлами и удаленным proxy-сервером -->
      <label><input id="use-local" type="checkbox" checked> Načítať lokálne kópie</label>
    </p>

    <!-- Контейнер чекбоксов для фильтрации кинотеатров -->
    <div id="filters" class="mb-3"></div>
    <!-- Сетка карточек: обязательно класс 'row' для работы flex-колонок и 'g-3' для отступов между ними (Шаг 4) -->
    <div id="cards" class="row g-3"></div>
  </main>
</body>
</html>
